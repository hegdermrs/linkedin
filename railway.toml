# Railway hints — set Start Command in the dashboard if the api service still exits.
# api:  /entrypoint-api.sh  (or use Dockerfile CMD)
# worker: /entrypoint-worker.sh

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "/entrypoint-api.sh"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
